<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>TreeTab</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 自定义背景图图层（可选） -->
<div id="bgLayer" aria-hidden="true"></div>

<div class="container">

  <!-- ================================================================
       HEADER —— 问候语 + 日期
       ================================================================ -->
  <header>
    <div class="header-left">
      <h1 id="greeting"></h1>
      <div class="date" id="dateDisplay"></div>
    </div>
    <div class="header-right">
      <!-- 自定义背景图按钮 -->
      <div class="bg-control">
        <button class="theme-toggle bg-toggle" id="bgToggleBtn" type="button" title="设置背景" popovertarget="bgPopover">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </button>

        <!-- 背景图设置弹层（原生 popover：顶层、轻触关闭、Escape 由浏览器处理） -->
        <div class="bg-popover" id="bgPopover" popover>
          <button type="button" class="bg-upload-btn" id="bgUploadBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
            </svg>
            <span>选择图片</span>
          </button>
          <input type="file" id="bgFileInput" accept="image/*" hidden>

          <button type="button" class="bg-remove-btn" id="bgRemoveBtn" hidden>移除背景</button>
        </div>
      </div>

      <!-- 深色模式切换按钮 -->
      <button class="theme-toggle" id="themeToggle" type="button" title="切换深色">
        <!-- 太阳图标（浅色模式时显示，表示可以切到深色） -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
        <!-- 月亮图标（深色模式时显示） -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display:none" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ================================================================
       SEARCH —— 只过滤当前窗口，不离开这台电脑
       ================================================================ -->
  <search class="tab-search">
    <form id="tabSearchForm" autocomplete="off">
      <label for="tabSearch">搜索</label>
      <div class="tab-search-field">
        <input id="tabSearch" name="q" type="search" placeholder="标题、网址或分组" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="searchHint">
        <button type="button" class="tab-search-clear" id="tabSearchClear" hidden>清除</button>
        <button type="submit" class="visually-hidden" tabindex="-1">跳到第一个结果</button>
      </div>
      <p id="searchHint" class="search-hint">只搜这个窗口。按 / 聚焦搜索框。</p>
    </form>
  </search>
  <p id="searchStatus" class="visually-hidden" aria-live="polite"></p>

  <!-- ================================================================
       多余的 TreeTab 页
       ================================================================ -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
      </div>
      <div class="tab-cleanup-text">
        开了 <strong id="tabOutDupeCount"></strong> 个 TreeTab 页，只留这一页？
      </div>
    </div>
    <button class="tab-cleanup-btn" type="button" data-action="close-tabout-dupes">关掉其他</button>
  </div>

  <!-- ================================================================
       SECTION 1: 未分组 —— 按网站整理还没进 Chrome 标签组的页面
       ================================================================ -->
  <section class="section" id="domainsSection">
    <div class="section-heading">
      <div class="section-header">
        <h2 id="domainsTitle">未分组</h2>
        <div class="section-line"></div>
        <div class="section-count" id="domainsCount"></div>
      </div>
      <p class="section-hint">还没进组的标签，按网站放在一起。</p>
    </div>

    <p class="ungroup-hint" id="ungroupHint">松手就能移出分组</p>

    <div class="missions" id="domainsMissions"></div>

    <div class="new-group-dropzone" id="newGroupDropzone">
      <div class="new-group-content">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>把标签拖到这里，新建分组</span>
      </div>
    </div>
  </section>

  <!-- ================================================================
       SECTION 2: 标签组 —— Chrome 原生分组，不重复列出未分组标签
       ================================================================ -->
  <section class="section" id="groupsSection" hidden>
    <div class="section-heading">
      <div class="section-header">
        <h2>标签组</h2>
        <div class="section-line"></div>
        <div class="section-count" id="groupsCount"></div>
      </div>
      <p class="section-hint">已经建好的分组。拖到别的组里，或拖到上面移出。</p>
    </div>

    <div class="groups-grid" id="groupsContainer"></div>
  </section>

  <!-- ================================================================
       最近关闭 —— 只存在 chrome.storage.local
       ================================================================ -->
  <section class="section" id="recentSection" hidden>
    <div class="section-heading">
      <div class="section-header">
        <h2>最近关闭</h2>
        <div class="section-line"></div>
        <div class="section-count" id="recentCount"></div>
      </div>
      <p class="section-hint" id="recentHint">只存在这台电脑上。</p>
    </div>
    <ul class="recent-list" id="recentList"></ul>
  </section>

  <!-- ================================================================
       FOOTER
       ================================================================ -->
  <footer>
    <div class="footer-stats">
      <div class="stat">
        <div class="stat-num" id="statTabs">—</div>
        <div class="stat-label">打开的标签</div>
        <div class="stat-badge" id="statBadge" role="img" aria-label="标签数量"></div>
      </div>
    </div>
    <div class="last-refresh">
      <span class="footer-note">
        <a href="https://github.com/userAlex110/TreeTab" target="_top">TreeTab</a>
      </span>
    </div>
  </footer>

</div><!-- end .container -->

<!-- ================================================================
     TOAST
     ================================================================ -->
<div class="toast" id="toast" popover="manual" role="status" aria-live="polite">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- 共享常量（app.js 与 background.js 共用） -->
<script src="shared.js"></script>
<!-- 主逻辑脚本 -->
<script src="app.js"></script>
</body>
</html>
